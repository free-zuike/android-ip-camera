name: Build Installable APK

# Upstream reproducible-build.yml uses -PskipSigning (unsigned, not
# installable) and never uploads the APK. This one emits a debug-signed APK.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach APK to a GitHub Release'
        type: boolean
        required: true
        default: false
      release_tag:
        description: 'Release tag (used when publish_release is true)'
        required: false
        default: 'ci-apk'
  push:
    tags: ['v*']
    branches: ['ci/phone-av']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK (auto-signed, installable)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          echo "== generated APKs =="
          find app/build/outputs/apk/debug -name '*.apk' -printf '%f\n' | sort
          # AGP emits armeabi-v7a / arm64-v8a / universal splits. The old
          # "head -n 1" picked whichever came first, usually the 32-bit one.
          APK=$(find app/build/outputs/apk/debug -name '*arm64-v8a*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::arm64-v8a APK not found"
            exit 1
          fi
          echo "Selected 64-bit APK: $APK"
          cp "$APK" dist/android-ip-camera-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Verify 64-bit ABI and fixed signing certificate
        shell: bash
        run: |
          APK=dist/android-ip-camera-debug.apk
          echo "== native libraries =="
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86)/' || \
            echo "(no bundled .so: pure Kotlin/Java APK, installs on 64-bit devices)"
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then
            echo "::error::armeabi-v7a libs found, build must be arm64-v8a only"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          echo "== signing certificate (must be identical on every build) =="
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee dist/SIGNING_CERT.txt
          else
            echo "apksigner not found, skipping certificate dump"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: installable-apk
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installable-apk
          path: dist

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "APK $TAG" \
            --notes "Built by GitHub Actions from $SHA" \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
